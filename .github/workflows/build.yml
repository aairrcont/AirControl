name: Build AirControl APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Allow manual trigger from GitHub website
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required for AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Download MediaPipe Hand Landmarker model automatically
      - name: Download MediaPipe Hand Landmarker model
        run: |
          echo "Downloading hand_landmarker.task from MediaPipe CDN..."
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          echo "Model size: $(du -sh app/src/main/assets/hand_landmarker.task)"

      # 4. Grant execute permission to gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. Cache Gradle dependencies (speeds up future builds)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Build the debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      # 7. Upload the APK as a downloadable artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirControl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 8. Print APK info
      - name: APK build info
        run: |
          echo "=============================="
          echo "✅ Build complete!"
          echo "APK location:"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          echo "=============================="
